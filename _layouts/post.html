---
layout: default
---
<article class="post-shell">
  <a class="eyebrow back-link" href="/blog/">← All writing</a>
  <header class="post-header">
    <div class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    <div class="post-meta">
      <span>{{ page.author | default: site.title }}</span>
      {% if page.tags %}<span>·</span><span>{{ page.tags | join: " · " }}</span>{% endif %}
    </div>
  </header>
  <div class="prose">{{ content }}</div>
</article>
